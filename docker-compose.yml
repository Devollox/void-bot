services:
  void-bot:
    image: void-bot:latest
    build:
      context: .
      dockerfile: Dockerfile
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 120s
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    mem_limit: 168m
    memswap_limit: 168m
